name: NeoForge build verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-datagen:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify data generation and compile mod
        shell: bash
        run: bash tools/verify-neoforge-build.sh

      - name: Upload build logs (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-build-logs
          path: build/verification/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mod JAR only when built
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dorohedoro-neoforge-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
