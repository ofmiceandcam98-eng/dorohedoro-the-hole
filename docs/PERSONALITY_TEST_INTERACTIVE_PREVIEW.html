<style>*{box-sizing:border-box}body{background:radial-gradient(circle at 70% 15%,#263b3b,#080c0d 65%);color:#e7dfcf;font:16px system-ui,sans-serif;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;padding:18px}main{max-width:690px;width:100%;border:3px solid #527e80;background:#141c1c;box-shadow:0 15px 65px #000b}header{background:linear-gradient(90deg,#183538,#294d4d);padding:15px 22px;text-transform:uppercase;font-size:14px;letter-spacing:2px;color:#aae2dc;font-weight:800}section{padding:25px}h1{font-size:26px;margin:4px 0 10px}p{color:#acbeb8;line-height:1.55}.progress{height:7px;background:#334342;margin:14px 0 20px}.bar{height:100%;background:#7ad7c8;width:0;transition:width .18s}.choices{display:grid;gap:10px}.choices button,button.action{cursor:pointer;padding:12px 15px;background:#233736;color:#f0e9da;border:1px solid #54847c;text-align:left;font:inherit;border-radius:3px}.choices button:hover,.choices button.selected{background:#315b55;border-color:#a7ded4}button.action{background:#386762;text-align:center;font-weight:700}button:disabled{opacity:.35;cursor:not-allowed}.actions{display:flex;gap:12px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.tiny{font-size:12px;color:#849d98}.tag{color:#96dfd3;font-weight:700}.scores{width:100%;border-collapse:collapse;font-size:14px}.scores td,.scores th{border-bottom:1px solid #304747;padding:8px;text-align:left}.preview{background:#172d2c;padding:12px;margin-top:18px;color:#9fe1d4;font-size:13px}</style></head>
<body><main><header>THE HOLE / CHARACTER ORIGIN — INTERACTIVE CONCEPT PREVIEW</header><section id="app"></section></main><script id="questions" type="application/json">{"version": "19.2", "questions": [{"id": "q01", "prompt": "A stranger collapses outside your door. You...", "options": [{"text": "Treat their injuries before asking questions.", "primary": "HEALING", "secondary": "PROTECTION", "primary_points": 3, "secondary_points": 1}, {"text": "Stand guard so nobody can hurt them.", "primary": "PROTECTION", "secondary": "HEALING", "primary_points": 3, "secondary_points": 1}, {"text": "Track the attacker and expose their weakness.", "primary": "DISMEMBERMENT", "secondary": "CURSE", "primary_points": 3, "secondary_points": 1}, {"text": "Make the attacker regret returning.", "primary": "CURSE", "secondary": "DESTRUCTION", "primary_points": 3, "secondary_points": 1}]}, {"id": "q02", "prompt": "A sealed passage blocks your way. You...", "options": [{"text": "Grow something through the cracks.", "primary": "MUSHROOM", "secondary": "CURSE", "primary_points": 3, "secondary_points": 1}, {"text": "Find a shape that can squeeze inside.", "primary": "REPTILE", "secondary": "DISMEMBERMENT", "primary_points": 3, "secondary_points": 1}, {"text": "Break down the obstruction.", "primary": "DESTRUCTION", "secondary": "MUSHROOM", "primary_points": 3, "secondary_points": 1}, {"text": "Study how it might have opened before.", "primary": "TIME", "secondary": "PROTECTION", "primary_points": 3, "secondary_points": 1}]}, {"id": "q03", "prompt": "A creature lunges at your friend. You...", "options": [{"text": "Create a barrier between them.", "primary": "PROTECTION", "secondary": "HEALING", "primary_points": 3, "secondary_points": 1}, {"text": "Punish it with a lasting affliction.", "primary": "CURSE", "secondary": "TIME", "primary_points": 3, "secondary_points": 1}, {"text": "Strike hard to end the threat quickly.", "primary": "DESTRUCTION", "secondary": "DISMEMBERMENT", "primary_points": 3, "secondary_points": 1}, {"text": "Disable its limbs with precision.", "primary": "DISMEMBERMENT", "secondary": "PROTECTION", "primary_points": 3, "secondary_points": 1}]}, {"id": "q04", "prompt": "You could undo one terrible event. You...", "options": [{"text": "Heal those who still suffer.", "primary": "HEALING", "secondary": "PROTECTION", "primary_points": 3, "secondary_points": 1}, {"text": "Turn back the critical moment.", "primary": "TIME", "secondary": "CURSE", "primary_points": 3, "secondary_points": 1}, {"text": "Protect others from a repeat.", "primary": "PROTECTION", "secondary": "TIME", "primary_points": 3, "secondary_points": 1}, {"text": "Let new life reclaim what was lost.", "primary": "MUSHROOM", "secondary": "HEALING", "primary_points": 3, "secondary_points": 1}]}, {"id": "q05", "prompt": "You are trapped underground. You...", "options": [{"text": "Adapt your body to find an escape route.", "primary": "REPTILE", "secondary": "PROTECTION", "primary_points": 3, "secondary_points": 1}, {"text": "Cultivate something that lights your path.", "primary": "MUSHROOM", "secondary": "HEALING", "primary_points": 3, "secondary_points": 1}, {"text": "Force open a new exit.", "primary": "DESTRUCTION", "secondary": "REPTILE", "primary_points": 3, "secondary_points": 1}, {"text": "Wait and study the rhythm of the tunnels.", "primary": "TIME", "secondary": "DISMEMBERMENT", "primary_points": 3, "secondary_points": 1}]}, {"id": "q06", "prompt": "In a dangerous fight, you trust...", "options": [{"text": "Clean, exact strikes.", "primary": "DISMEMBERMENT", "secondary": "REPTILE", "primary_points": 3, "secondary_points": 1}, {"text": "Overwhelming pressure.", "primary": "DESTRUCTION", "secondary": "CURSE", "primary_points": 3, "secondary_points": 1}, {"text": "A consequence your enemy cannot ignore.", "primary": "CURSE", "secondary": "MUSHROOM", "primary_points": 3, "secondary_points": 1}, {"text": "Staying safe until a chance appears.", "primary": "PROTECTION", "secondary": "TIME", "primary_points": 3, "secondary_points": 1}]}, {"id": "q07", "prompt": "An unfamiliar sickness spreads. You...", "options": [{"text": "Care for the sick and search for treatment.", "primary": "HEALING", "secondary": "MUSHROOM", "primary_points": 3, "secondary_points": 1}, {"text": "Study what is growing inside the victims.", "primary": "MUSHROOM", "secondary": "HEALING", "primary_points": 3, "secondary_points": 1}, {"text": "Trace the earliest cases and their timing.", "primary": "TIME", "secondary": "DISMEMBERMENT", "primary_points": 3, "secondary_points": 1}, {"text": "Find the source and seal it away.", "primary": "CURSE", "secondary": "PROTECTION", "primary_points": 3, "secondary_points": 1}]}, {"id": "q08", "prompt": "You are offered a new body. You...", "options": [{"text": "Accept a stronger, stranger form.", "primary": "REPTILE", "secondary": "DESTRUCTION", "primary_points": 3, "secondary_points": 1}, {"text": "Choose precise control over every movement.", "primary": "DISMEMBERMENT", "secondary": "REPTILE", "primary_points": 3, "secondary_points": 1}, {"text": "Keep your body and gain a protective shell.", "primary": "PROTECTION", "secondary": "HEALING", "primary_points": 3, "secondary_points": 1}, {"text": "Restore your body to its healthiest state.", "primary": "HEALING", "secondary": "TIME", "primary_points": 3, "secondary_points": 1}]}, {"id": "q09", "prompt": "Black smoke gathers around your hands. You...", "options": [{"text": "Shape it into something that can spread.", "primary": "MUSHROOM", "secondary": "CURSE", "primary_points": 3, "secondary_points": 1}, {"text": "Let it reshape you.", "primary": "REPTILE", "secondary": "HEALING", "primary_points": 3, "secondary_points": 1}, {"text": "Launch it forward as a weapon.", "primary": "DESTRUCTION", "secondary": "DISMEMBERMENT", "primary_points": 3, "secondary_points": 1}, {"text": "Try to suspend one moment within it.", "primary": "TIME", "secondary": "PROTECTION", "primary_points": 3, "secondary_points": 1}]}, {"id": "q10", "prompt": "Someone threatens the people you love. You...", "options": [{"text": "Shield them, even if you must stand alone.", "primary": "PROTECTION", "secondary": "REPTILE", "primary_points": 3, "secondary_points": 1}, {"text": "Restore anyone who is hurt.", "primary": "HEALING", "secondary": "MUSHROOM", "primary_points": 3, "secondary_points": 1}, {"text": "Make the threat carry a terrible mark.", "primary": "CURSE", "secondary": "DESTRUCTION", "primary_points": 3, "secondary_points": 1}, {"text": "End the threat with exact force.", "primary": "DISMEMBERMENT", "secondary": "TIME", "primary_points": 3, "secondary_points": 1}]}, {"id": "q11", "prompt": "In an abandoned factory, you notice...", "options": [{"text": "Fungi growing in the damp machinery.", "primary": "MUSHROOM", "secondary": "HEALING", "primary_points": 3, "secondary_points": 1}, {"text": "A machine that could change your body.", "primary": "REPTILE", "secondary": "DISMEMBERMENT", "primary_points": 3, "secondary_points": 1}, {"text": "The energy still trapped in its engines.", "primary": "DESTRUCTION", "secondary": "PROTECTION", "primary_points": 3, "secondary_points": 1}, {"text": "Clocks frozen at the same instant.", "primary": "TIME", "secondary": "CURSE", "primary_points": 3, "secondary_points": 1}]}, {"id": "q12", "prompt": "What kind of mastery appeals to you?", "options": [{"text": "Understanding where to separate and repair.", "primary": "DISMEMBERMENT", "secondary": "HEALING", "primary_points": 3, "secondary_points": 1}, {"text": "The ability to rewrite a lasting consequence.", "primary": "CURSE", "secondary": "TIME", "primary_points": 3, "secondary_points": 1}, {"text": "The discipline to protect without retreat.", "primary": "PROTECTION", "secondary": "DESTRUCTION", "primary_points": 3, "secondary_points": 1}, {"text": "The power to heal what others cannot.", "primary": "HEALING", "secondary": "MUSHROOM", "primary_points": 3, "secondary_points": 1}]}], "score": "3 points for chosen primary; 1 for chosen secondary; stable tie-break in MagicType order", "modes": ["recommended", "choose", "fate"], "rarity_weights": {"MUSHROOM": 3, "REPTILE": 3, "DISMEMBERMENT": 3, "HEALING": 4, "CURSE": 2, "PROTECTION": 4, "TIME": 1, "DESTRUCTION": 4}}</script>
<script>
const data=JSON.parse(document.getElementById('questions').textContent);const names=Object.keys(data.rarity_weights);let stage='origin',index=0,answers=Array(12).fill(-1),chosen=names[0],ending='';const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function score(){const scores=Object.fromEntries(names.map(n=>[n,0]));data.questions.forEach((q,i)=>{const o=q.options[answers[i]];if(o){scores[o.primary]+=3;scores[o.secondary]+=1}});return scores}
function top(){const s=score();return names.reduce((a,b)=>s[b]>s[a]?b:a,names[0])}
function fate(){const s=score(),weights=names.map(n=>(2+s[n])*data.rarity_weights[n]);let roll=Math.random()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<names.length;i++){roll-=weights[i];if(roll<0)return names[i]}return names.at(-1)}
function btn(label,fn,disabled=false){return `<button class="action" ${disabled?'disabled':''} onclick="${fn}">${esc(label)}</button>`}
function show(){let h=''; if(stage==='origin'){h='<h1>Who are you in this world?</h1><p>Choose an origin. Devilhood is an earned ascension path.</p><div class="choices"><button onclick="selectOrigin(\'human\')">Human · Survival and skill</button><button onclick="selectOrigin(\'sorcerer\')">Sorcerer · Innate smoke magic</button><button disabled>Devil · Locked ascension path</button></div>'}
else if(stage==='quiz'){const q=data.questions[index];h=`<div class="tag">SORCERER APTITUDE — QUESTION ${index+1} OF ${data.questions.length}</div><div class="progress"><div class="bar" style="width:${(index+1)*100/data.questions.length}%"></div></div><h1>${esc(q.prompt)}</h1><div class="choices">${q.options.map((o,i)=>`<button class="${answers[index]===i?'selected':''}" onclick="answer(${i})">${answers[index]===i?'●':'○'} ${esc(o.text)}</button>`).join('')}</div><div class="actions">${btn('← Back','back()')}${btn(index===11?'Reveal affinity':'Next →','next()',answers[index]<0)}</div><p class="tiny">Your choices are scored secretly in the finished mod. You can return to any previous question.</p>`}
else if(stage==='result'){h=`<div class="tag">APTITUDE EXAM COMPLETE</div><h1>Your strongest resonance: ${esc(top())}</h1><p>The test favors this smoke type, but your character is yours to shape. Decide how to accept your innate magic.</p><div class="choices">${btn('Accept recommended: '+top(),'complete(\'recommended\')')}${btn('Choose my magic','choose()')}${btn('Trust fate · weighted roll','complete(\'fate\')')}${btn('Review answers','review()')}</div><p class="tiny">Fate uses your answer scores and configured rarity weights. Time is rarer but not impossible.</p>`}
else if(stage==='choose'){h=`<div class="tag">FREE CHOICE</div><h1>Choose your innate magic</h1><div class="choices">${names.map(n=>`<button class="${chosen===n?'selected':''}" onclick="setMagic('${n}')">${chosen===n?'●':'○'} ${esc(n)}</button>`).join('')}</div><div class="actions">${btn('← Back','reviewResult()')}${btn('Confirm magic','complete(\'choose\')')}</div>`}
else if(stage==='done'){h=`<div class="tag">CHARACTER CREATED — PREVIEW ONLY</div><h1>${esc(ending)}</h1><p>Your character would now be saved by the server-side profile system. This browser preview does not save any Minecraft character.</p><details><summary>Inspect my affinity scores</summary><table class="scores"><tr><th>Magic type</th><th>Score</th></tr>${Object.entries(score()).map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v}</td></tr>`).join('')}</table></details><div class="actions">${btn('Restart','restart()')}</div>`}
app.innerHTML=h+'<div class="preview">Interactive browser concept. Minecraft code uses the same 12 questions and scoring map, but in-game startup and saving still require a verified NeoForge build.</div>';}
window.selectOrigin=n=>{if(n==='human'){ending='Human';stage='done'}else{stage='quiz';index=0}show()};window.answer=n=>{answers[index]=n;show()};window.back=()=>{if(index>0)index--;else stage='origin';show()};window.next=()=>{if(answers[index]<0)return;if(index<11)index++;else stage='result';show()};window.review=()=>{index=0;stage='quiz';show()};window.reviewResult=()=>{stage='result';show()};window.choose=()=>{chosen=top();stage='choose';show()};window.setMagic=n=>{chosen=n;show()};window.complete=mode=>{ending=mode==='fate'?'Sorcerer / '+fate()+' (Fate)':mode==='choose'?'Sorcerer / '+chosen+' (Chosen)':'Sorcerer / '+top()+' (Recommended)';stage='done';show()};window.restart=()=>{stage='origin';index=0;answers.fill(-1);show()};show();</script></body></html>
