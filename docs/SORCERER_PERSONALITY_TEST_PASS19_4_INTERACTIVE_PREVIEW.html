<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Hole — Sorcerer Aptitude & Fate</title>
<style>
*{box-sizing:border-box}body{background:radial-gradient(circle at 70% 15%,#304241,#0a0e0f 72%);color:#e7dfcf;font:16px system-ui,-apple-system,sans-serif;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;padding:18px}main{max-width:720px;width:100%;border:3px solid #547d7c;background:#141c1c;box-shadow:0 15px 65px #000b}header{background:linear-gradient(90deg,#183538,#294d4d);padding:15px 22px;text-transform:uppercase;font-size:14px;letter-spacing:2px;color:#aae2dc;font-weight:800}section{padding:26px}h1{font-size:27px;margin:4px 0 14px}h2{font-size:19px}p{color:#b3c4be;line-height:1.55}.progress{height:7px;background:#334342;margin:14px 0 20px}.bar{height:100%;background:#7ad7c8;width:0;transition:width .18s}.choices{display:grid;gap:10px}.choices button,button.action{cursor:pointer;padding:12px 15px;background:#243736;color:#f0e9da;border:1px solid #54847c;text-align:left;font:inherit;border-radius:3px}.choices button:hover,.choices button.selected{background:#315b55;border-color:#a7ded4}button.action{background:#386762;text-align:center;font-weight:700}button:disabled{opacity:.35;cursor:not-allowed}.actions{display:flex;gap:12px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.tiny{font-size:12px;color:#92aaa3}.tag{color:#96dfd3;font-size:13px;font-weight:800;letter-spacing:1.5px}.scores{width:100%;border-collapse:collapse;font-size:14px}.scores td,.scores th{border-bottom:1px solid #304747;padding:8px;text-align:left}.preview{font-size:11px;color:#8ca7a2;border-top:1px solid #355150;margin-top:26px;padding-top:12px}.muted{opacity:.6}.emphasis{font-size:36px;color:#bce7d5;text-transform:capitalize}.compact{display:flex;gap:12px;flex-wrap:wrap}.compact button{flex:1}.rarity{color:#d5b887}button:focus-visible{outline:3px solid #b2ffe9;outline-offset:2px}
</style></head><body><main><header>THE HOLE // ORIGIN & SMOKE DISCOVERY · PASS 19.4</header><section id="app"></section></main>
<script id="questions" type="application/json">{"version":"19.4","questions":[{"id":"q01","prompt":"A stranger collapses outside your door. You...","options":[{"text":"Treat their injuries before asking questions.","primary":"HEALING","secondary":"PROTECTION","primary_points":3,"secondary_points":1},{"text":"Stand guard so nobody can hurt them.","primary":"PROTECTION","secondary":"HEALING","primary_points":3,"secondary_points":1},{"text":"Track the attacker and expose their weakness.","primary":"DISMEMBERMENT","secondary":"CURSE","primary_points":3,"secondary_points":1},{"text":"Make the attacker regret returning.","primary":"CURSE","secondary":"DESTRUCTION","primary_points":3,"secondary_points":1}]},{"id":"q02","prompt":"A sealed passage blocks your way. You...","options":[{"text":"Grow something through the cracks.","primary":"MUSHROOM","secondary":"CURSE","primary_points":3,"secondary_points":1},{"text":"Find a shape that can squeeze inside.","primary":"REPTILE","secondary":"DISMEMBERMENT","primary_points":3,"secondary_points":1},{"text":"Break down the obstruction.","primary":"DESTRUCTION","secondary":"MUSHROOM","primary_points":3,"secondary_points":1},{"text":"Study how it might have opened before.","primary":"TIME","secondary":"PROTECTION","primary_points":3,"secondary_points":1}]},{"id":"q03","prompt":"A creature lunges at your friend. You...","options":[{"text":"Create a barrier between them.","primary":"PROTECTION","secondary":"HEALING","primary_points":3,"secondary_points":1},{"text":"Punish it with a lasting affliction.","primary":"CURSE","secondary":"TIME","primary_points":3,"secondary_points":1},{"text":"Strike hard to end the threat quickly.","primary":"DESTRUCTION","secondary":"DISMEMBERMENT","primary_points":3,"secondary_points":1},{"text":"Disable its limbs with precision.","primary":"DISMEMBERMENT","secondary":"PROTECTION","primary_points":3,"secondary_points":1}]},{"id":"q04","prompt":"You could undo one terrible event. You...","options":[{"text":"Heal those who still suffer.","primary":"HEALING","secondary":"PROTECTION","primary_points":3,"secondary_points":1},{"text":"Turn back the critical moment.","primary":"TIME","secondary":"CURSE","primary_points":3,"secondary_points":1},{"text":"Protect others from a repeat.","primary":"PROTECTION","secondary":"TIME","primary_points":3,"secondary_points":1},{"text":"Let new life reclaim what was lost.","primary":"MUSHROOM","secondary":"HEALING","primary_points":3,"secondary_points":1}]},{"id":"q05","prompt":"You are trapped underground. You...","options":[{"text":"Adapt your body to find an escape route.","primary":"REPTILE","secondary":"PROTECTION","primary_points":3,"secondary_points":1},{"text":"Cultivate something that lights your path.","primary":"MUSHROOM","secondary":"HEALING","primary_points":3,"secondary_points":1},{"text":"Force open a new exit.","primary":"DESTRUCTION","secondary":"REPTILE","primary_points":3,"secondary_points":1},{"text":"Wait and study the rhythm of the tunnels.","primary":"TIME","secondary":"DISMEMBERMENT","primary_points":3,"secondary_points":1}]},{"id":"q06","prompt":"In a dangerous fight, you trust...","options":[{"text":"Clean, exact strikes.","primary":"DISMEMBERMENT","secondary":"REPTILE","primary_points":3,"secondary_points":1},{"text":"Overwhelming pressure.","primary":"DESTRUCTION","secondary":"CURSE","primary_points":3,"secondary_points":1},{"text":"A consequence your enemy cannot ignore.","primary":"CURSE","secondary":"MUSHROOM","primary_points":3,"secondary_points":1},{"text":"Staying safe until a chance appears.","primary":"PROTECTION","secondary":"TIME","primary_points":3,"secondary_points":1}]},{"id":"q07","prompt":"An unfamiliar sickness spreads. You...","options":[{"text":"Care for the sick and search for treatment.","primary":"HEALING","secondary":"MUSHROOM","primary_points":3,"secondary_points":1},{"text":"Study what is growing inside the victims.","primary":"MUSHROOM","secondary":"HEALING","primary_points":3,"secondary_points":1},{"text":"Trace the earliest cases and their timing.","primary":"TIME","secondary":"DISMEMBERMENT","primary_points":3,"secondary_points":1},{"text":"Find the source and seal it away.","primary":"CURSE","secondary":"PROTECTION","primary_points":3,"secondary_points":1}]},{"id":"q08","prompt":"You are offered a new body. You...","options":[{"text":"Accept a stronger, stranger form.","primary":"REPTILE","secondary":"DESTRUCTION","primary_points":3,"secondary_points":1},{"text":"Choose precise control over every movement.","primary":"DISMEMBERMENT","secondary":"REPTILE","primary_points":3,"secondary_points":1},{"text":"Keep your body and gain a protective shell.","primary":"PROTECTION","secondary":"HEALING","primary_points":3,"secondary_points":1},{"text":"Restore your body to its healthiest state.","primary":"HEALING","secondary":"TIME","primary_points":3,"secondary_points":1}]},{"id":"q09","prompt":"Black smoke gathers around your hands. You...","options":[{"text":"Shape it into something that can spread.","primary":"MUSHROOM","secondary":"CURSE","primary_points":3,"secondary_points":1},{"text":"Let it reshape you.","primary":"REPTILE","secondary":"HEALING","primary_points":3,"secondary_points":1},{"text":"Launch it forward as a weapon.","primary":"DESTRUCTION","secondary":"DISMEMBERMENT","primary_points":3,"secondary_points":1},{"text":"Try to suspend one moment within it.","primary":"TIME","secondary":"PROTECTION","primary_points":3,"secondary_points":1}]},{"id":"q10","prompt":"Someone threatens the people you love. You...","options":[{"text":"Shield them, even if you must stand alone.","primary":"PROTECTION","secondary":"REPTILE","primary_points":3,"secondary_points":1},{"text":"Restore anyone who is hurt.","primary":"HEALING","secondary":"MUSHROOM","primary_points":3,"secondary_points":1},{"text":"Make the threat carry a terrible mark.","primary":"CURSE","secondary":"DESTRUCTION","primary_points":3,"secondary_points":1},{"text":"End the threat with exact force.","primary":"DISMEMBERMENT","secondary":"TIME","primary_points":3,"secondary_points":1}]},{"id":"q11","prompt":"In an abandoned factory, you notice...","options":[{"text":"Fungi growing in the damp machinery.","primary":"MUSHROOM","secondary":"HEALING","primary_points":3,"secondary_points":1},{"text":"A machine that could change your body.","primary":"REPTILE","secondary":"DISMEMBERMENT","primary_points":3,"secondary_points":1},{"text":"The energy still trapped in its engines.","primary":"DESTRUCTION","secondary":"PROTECTION","primary_points":3,"secondary_points":1},{"text":"Clocks frozen at the same instant.","primary":"TIME","secondary":"CURSE","primary_points":3,"secondary_points":1}]},{"id":"q12","prompt":"What kind of mastery appeals to you?","options":[{"text":"Understanding where to separate and repair.","primary":"DISMEMBERMENT","secondary":"HEALING","primary_points":3,"secondary_points":1},{"text":"The ability to rewrite a lasting consequence.","primary":"CURSE","secondary":"TIME","primary_points":3,"secondary_points":1},{"text":"The discipline to protect without retreat.","primary":"PROTECTION","secondary":"DESTRUCTION","primary_points":3,"secondary_points":1},{"text":"The power to heal what others cannot.","primary":"HEALING","secondary":"MUSHROOM","primary_points":3,"secondary_points":1}]}],"score":"3 points for chosen primary; 1 for chosen secondary; stable tie-break in MagicType order","rarity_weights":{"MUSHROOM":3,"REPTILE":3,"DISMEMBERMENT":3,"HEALING":4,"CURSE":2,"PROTECTION":4,"TIME":1,"DESTRUCTION":4},"questions_per_run":8,"bank_size":12,"selection_policy":"Eight random distinct questions; hidden +3/+1; highest-score only. Tied highest scores: choose only among tied types. Optional skip-quiz Fate roll weighted by configured fateWeight. No unrestricted choice or reroll.","ties":"Player choice restricted to precisely the types tied for maximum score. Server validates.","fate":"Optional before quiz submission: weighted server-side random roll among all 8 specialties; result permanent."}</script><script>
const data=JSON.parse(document.getElementById('questions').textContent);
const types=Object.keys(data.rarity_weights),app=document.getElementById('app');
let stage='origin',index=0,order=[],answers=[],ending='',route='',ties=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function session(){order=Array.from({length:data.questions.length},(_,i)=>i);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}order=order.slice(0,8);answers=Array(8).fill(-1);index=0;}
function points(){let tally=Object.fromEntries(types.map(t=>[t,0]));order.forEach((qi,i)=>{let opt=data.questions[qi].options[answers[i]];if(opt){tally[opt.primary]+=3;tally[opt.secondary]+=1;}});return tally;}
function best(){let p=points(),peak=Math.max(...Object.values(p));return types.filter(t=>p[t]===peak)}
function fate(){let total=Object.values(data.rarity_weights).reduce((a,b)=>a+b,0),roll=Math.random()*total;for(let t of types){roll-=data.rarity_weights[t];if(roll<0)return t;}return types[types.length-1]}
function btn(label,fn,disabled=false){return `<button class="action" ${disabled?'disabled':''} onclick="${fn}">${esc(label)}</button>`}
function show(){let h='';
if(stage==='origin')h='<div class="tag">FIRST JOIN · CHARACTER ORIGIN</div><h1>Who are you in this world?</h1><p>Humans rely on ingenuity and survival. Sorcerers manifest one innate smoke power. Devilhood is earned later.</p><div class="choices"><button onclick="chooseOrigin(\'human\')">Human — Survival, combat and resourcefulness</button><button onclick="chooseOrigin(\'sorcerer\')">Sorcerer — Innate smoke and magical mastery</button><button disabled>Devil — Locked ascension path</button></div>';
else if(stage==='mode')h='<div class="tag">SORCERER · TWO PATHS</div><h1>How will your smoke manifest?</h1><p>Take a personality examination, or leave your natural aptitude entirely to fate. Neither route allows unrestricted magic selection.</p><div class="choices"><button onclick="startQuiz()"><b>The Personality Test</b><br><span class="tiny">Eight randomized questions · hidden affinity points · choose only if top types tie</span></button><button onclick="takeFate()"><b>Trust Fate</b><br><span class="tiny">Skip the test · a weighted random roll picks your permanent magic</span></button></div><div class="actions">'+btn('← Back to origins','backOrigin()')+'</div>';
else if(stage==='quiz'){let q=data.questions[order[index]];h=`<div class="tag">SORCERER APTITUDE · QUESTION ${index+1} OF ${order.length}</div><div class="progress"><div class="bar" style="width:${100*(index+1)/order.length}%"></div></div><h1>${esc(q.prompt)}</h1><div class="choices">${q.options.map((o,i)=>`<button class="${answers[index]===i?'selected':''}" onclick="answer(${i})">${answers[index]===i?'●':'○'} ${esc(o.text)}</button>`).join('')}</div><div class="actions">${btn('← Back','previous()')}${btn(index===order.length-1?'Reveal my affinity':'Next →','next()',answers[index]<0)}</div><p class="tiny">The examination's affinity points are deliberately hidden. Questions are shuffled each new preview.</p>`;}
else if(stage==='tie'){h=`<div class="tag">AN UNUSUAL RESULT · SHARED AFFINITY</div><h1>Your strongest affinities are tied.</h1><p>You may select only one of your top-scoring types. The other types aren't available.</p><div class="choices">${ties.map(t=>`<button onclick="pickTie('${t}')">${esc(t[0]+t.slice(1).toLowerCase())}</button>`).join('')}</div>`;}
else if(stage==='done'){let p=points();h=`<div class="tag">INNATE MAGIC REVEALED · ${esc(route)}</div><h1 class="emphasis">${esc(ending)}</h1><p>${route==='HUMAN'?'You begin as an ordinary resident of The Hole.':'Your smoke type has been assigned. In Minecraft, this result would be saved to your character and cannot be freely rerolled.'}</p>${route!=='FATE'&&route!=='HUMAN'?`<details><summary>Developer-only inspection of hidden affinity scores</summary><table class="scores"><tr><th>Magic</th><th>Score</th></tr>${Object.entries(p).sort((a,b)=>b[1]-a[1]).map(([t,v])=>`<tr><td>${esc(t)}</td><td>${v}</td></tr>`).join('')}</table></details>`:''}<div class="actions">${btn('Restart demonstration','restart()')}</div>`;}
app.innerHTML=h+'<div class="preview">This is a browser preview, not the Minecraft client. Restart is for demonstration only; real assigned results are server-owned and persistent.</div>';
}
window.chooseOrigin=t=>{if(t==='human'){ending='Human';route='HUMAN';stage='done';}else stage='mode';show()};
window.backOrigin=()=>{stage='origin';show()};
window.startQuiz=()=>{session();stage='quiz';show()};
window.takeFate=()=>{ending=fate();route='FATE';stage='done';show()};
window.answer=n=>{answers[index]=n;show()};
window.previous=()=>{if(index>0)index--;else stage='mode';show()};
window.next=()=>{if(answers[index]<0)return;if(index<order.length-1){index++;}else{ties=best();if(ties.length===1){ending=ties[0];route='PERSONALITY QUIZ';stage='done';}else{stage='tie';}}show()};
window.pickTie=t=>{if(!ties.includes(t))return;ending=t;route='TIED RESULT';stage='done';show()};
window.restart=()=>{stage='origin';index=0;order=[];answers=[];ending='';ties=[];route='';show()};
show();
</script></body></html>
